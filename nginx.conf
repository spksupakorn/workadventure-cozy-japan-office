# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wa.alternatepro.com;

    return 301 https://$host$request_uri;
}

# 2. HTTPS Reverse Proxy for WorkAdventure
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wa.alternatepro.com;

    # SSL Certificates จาก Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/wa.alternatepro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.alternatepro.com/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    location / {
        proxy_pass http://127.0.0.1:8088;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}